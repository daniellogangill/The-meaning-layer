name: Test interactive lab UI
on:
  push:
    branches: [main, feature/five-dollar-budget-and-ai-workbench, feature/prototype4-guided-executive-journey]
    paths:
      - 'index.html'
      - 'journey.html'
      - 'lab/journey.js'
      - 'lab/journey.css'
      - 'tests/test_guided_journey.cjs'
      - 'lab/app.js'
      - 'lab/ai.html'
      - 'lab/ai.js'
      - 'lab/style.css'
      - 'lab/data.json'
      - 'tests/test_lab_frontend.cjs'
      - 'tests/test_ai_workbench.cjs'
      - '.github/workflows/lab-ui-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'journey.html'
      - 'lab/journey.js'
      - 'lab/journey.css'
      - 'tests/test_guided_journey.cjs'
      - 'lab/app.js'
      - 'lab/ai.html'
      - 'lab/ai.js'
      - 'lab/style.css'
      - 'lab/data.json'
      - 'tests/test_lab_frontend.cjs'
      - 'tests/test_ai_workbench.cjs'
      - '.github/workflows/lab-ui-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app JavaScript syntax
        run: |
          node --check lab/app.js
          node --check lab/ai.js
          node --check lab/journey.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-audit --no-fund jsdom@26
      - name: Test browser interactions against actual generated corpus
        run: node --test tests/test_lab_frontend.cjs tests/test_ai_workbench.cjs tests/test_guided_journey.cjs
