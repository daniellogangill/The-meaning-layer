name: Build semantic lab snapshot
on:
  push:
    branches: [main]
    paths:
      - 'src/meaning_lab.py'
      - 'src/claim_assessment.py'
      - 'tests/test_meaning_lab.py'
      - 'tests/test_claim_assessment.py'
      - '.github/workflows/lab-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Export public synthetic dataset
        run: python -m src.meaning_lab --output lab/data.json
      - name: Check that restricted content is not in public payload
        run: |
          python - <<'PY'
          import json
          with open('lab/data.json', encoding='utf8') as f:
              data=json.load(f)
          assert all('text' not in r for r in data['restricted_metadata'])
          assert all(r['classification']=='internal' for r in data['records'])
          assert data['evaluation']['gold_labeled'] > 0
          PY
      - name: Commit reproducible snapshot for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh reproducible semantic lab snapshot [skip ci]"
            git push
          else
            echo "No snapshot changes."
          fi
